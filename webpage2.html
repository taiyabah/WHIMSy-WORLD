<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whimsy World</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;
      font-family: "Comic Sans MS", cursive;
      background: linear-gradient(135deg, #ffdde1, #c2ffd8, #dbe6ff);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.3);
      padding: 40px;
      border-radius: 25px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      z-index: 2;
    }

    h1 {
      font-size: 4rem;
      color: #ff4f81;
      animation: bounce 2s infinite;
    }

    p {
      margin-top: 15px;
      font-size: 1.3rem;
      color: #444;
    }

    button {
      margin-top: 25px;
      padding: 15px 30px;
      border: none;
      border-radius: 50px;
      background: #ff9a9e;
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.1) rotate(-2deg);
      background: #ff4f81;
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      opacity: 0.7;
      animation: float 10s infinite linear;
    }

    @keyframes float {
      from {
        transform: translateY(100vh) scale(0);
      }
      to {
        transform: translateY(-120vh) scale(1);
      }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .magic {
      position: absolute;
      font-size: 2rem;
      animation: spin 6s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg) translateX(100px) rotate(0deg); }
      to { transform: rotate(360deg) translateX(100px) rotate(-360deg); }
    }
  </style>
</head>

<body>

  <!-- Floating bubbles -->
  <div class="bubble" style="width:80px;height:80px;background:#ff9a9e;left:10%;animation-duration:12s;"></div>
  <div class="bubble" style="width:50px;height:50px;background:#a18cd1;left:30%;animation-duration:8s;"></div>
  <div class="bubble" style="width:100px;height:100px;background:#fbc2eb;left:70%;animation-duration:15s;"></div>
  <div class="bubble" style="width:60px;height:60px;background:#84fab0;left:85%;animation-duration:10s;"></div>

  <!-- Magic stars -->
  <div class="magic" style="top:20%;left:20%;">✨</div>
  <div class="magic" style="top:70%;left:75%;">🌈</div>
  <div class="magic" style="top:50%;left:10%;">🦄</div>

  <div class="container">
    <h1>Whimsy World 🌸</h1>
    <p>Click the button to sprinkle some magic!</p>

    <button onclick="magicTime()">✨ Surprise Me ✨</button>
  </div>

  <script>
    const messages = [
      "You are made of stardust ✨",
      "A tiny dragon believes in you 🐉",
      "Today is secretly enchanted 🌈",
      "You found a hidden sparkle 💖",
      "The moon says hello 🌙",
      "A cloud just smiled at you ☁️"
    ];

    function magicTime() {
      const randomMessage =
        messages[Math.floor(Math.random() * messages.length)];

      alert(randomMessage);

      createConfetti();
    }

    function createConfetti() {
      for (let i = 0; i < 30; i++) {
        const confetti = document.createElement("div");

        confetti.style.position = "absolute";
        confetti.style.width = "10px";
        confetti.style.height = "10px";
        confetti.style.background =
          `hsl(${Math.random() * 360}, 100%, 70%)`;

        confetti.style.left = Math.random() * window.innerWidth + "px";
        confetti.style.top = "-10px";
        confetti.style.borderRadius = "50%";

        document.body.appendChild(confetti);

        let fall = setInterval(() => {
          confetti.style.top =
            confetti.offsetTop + 5 + "px";

          confetti.style.left =
            confetti.offsetLeft +
            (Math.random() * 6 - 3) + "px";

          if (confetti.offsetTop > window.innerHeight) {
            confetti.remove();
            clearInterval(fall);
          }
        }, 20);
      }
    }
  </script>

</body>
</html>
